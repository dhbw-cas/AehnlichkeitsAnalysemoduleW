server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    # Seite, Skripte, Styles und Daten müssen nach einem Deployment zusammenpassen: immer beim Server
    # nachfragen (bei unveränderter Datei antwortet nginx kurz mit 304 statt die Datei erneut zu senden).
    # Hinweis: add_header in einem location-Block ersetzt die Header der Serverebene, daher je Block vollständig.
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy same-origin;

    # Fremdbibliotheken mit fester Version ändern sich praktisch nie
    location /vendor/ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy same-origin;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
