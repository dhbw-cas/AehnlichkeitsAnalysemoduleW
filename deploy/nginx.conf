server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    # Passwortschutz für die ganze Seite; die Datei schreibt deploy/40-basic-auth.sh beim Containerstart
    auth_basic "Modullandschaft";
    auth_basic_user_file /etc/nginx/htpasswd;

    # Seite, Skripte, Styles und Daten müssen nach einem Deployment zusammenpassen: immer beim Server
    # nachfragen (bei unveränderter Datei antwortet nginx kurz mit 304 statt die Datei erneut zu senden).
    # Hinweis: add_header in einem location-Block ersetzt die Header der Serverebene, daher je Block vollständig.
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy same-origin;

    # Fremdbibliotheken mit fester Version ändern sich praktisch nie
    # („private“: nur der Browser darf cachen – Antworten hinter Passwortschutz nie in geteilten Caches)
    location /vendor/ {
        add_header Cache-Control "private, max-age=604800";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy same-origin;
    }

    # Healthcheck für Sliplane ohne Anmeldung
    location = /healthz {
        auth_basic off;
        access_log off;
        return 200 "ok\n";
    }
}
